<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="PuzzleKids">
<title>PuzzleKids 🧩</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#FFF9F0;--accent:#FF6B35;--accent2:#4ECDC4;--accent3:#FFE66D;--text:#2C2C2A;--muted:#888780;--r:20px}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:var(--text)}
.screen{display:none;position:fixed;inset:0;z-index:1;flex-direction:column;align-items:center;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:40px 20px 60px}
.screen.active{display:flex;z-index:10}
#puzzle-screen{padding:0;background:#0f0f1a;overflow:hidden}
#win-screen{background:#1a0533;color:white;text-align:center;justify-content:center;overflow:hidden}

.logo{font-size:56px;margin-top:20px}
.app-name{font-size:34px;font-weight:800;color:var(--accent);margin-top:8px}
.app-sub{font-size:16px;color:var(--muted);margin-bottom:44px;margin-top:4px}
.big-btn{width:100%;max-width:340px;padding:20px 24px;border-radius:var(--r);border:none;cursor:pointer;margin-bottom:16px;display:flex;align-items:center;gap:16px;box-shadow:0 4px 20px rgba(0,0,0,.12);transition:transform .12s;text-align:left}
.big-btn:active{transform:scale(.96)}
.big-btn .icon{font-size:38px;flex-shrink:0}
.big-btn .t1{font-size:18px;font-weight:800}
.big-btn .t2{font-size:13px;font-weight:400;opacity:.75;margin-top:2px}
.btn-a{background:var(--accent);color:white}
.btn-b{background:var(--accent2);color:white}
.btn-c{background:var(--accent3);color:var(--text)}

.back-btn{align-self:flex-start;background:none;border:none;font-size:18px;font-weight:700;color:var(--accent);cursor:pointer;margin-bottom:12px}
.screen-title{font-size:24px;font-weight:800;margin-bottom:24px;align-self:flex-start}
.sg{width:100%;max-width:400px;margin-bottom:24px}
.sl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.option-row{display:flex;gap:10px;flex-wrap:wrap}
.opt{padding:12px 18px;border-radius:50px;border:2.5px solid #E0DDD5;background:white;font-size:15px;font-weight:600;cursor:pointer;transition:all .12s;color:var(--text)}
.opt.sel{border-color:var(--accent);background:var(--accent);color:white}
.opt:active{transform:scale(.94)}
.upload-area{width:100%;max-width:400px;height:190px;border:3px dashed #D3D1C7;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:white;margin-bottom:24px;overflow:hidden;position:relative}
.upload-area img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.uph{display:flex;flex-direction:column;align-items:center;pointer-events:none}
.start-btn{width:100%;max-width:400px;padding:18px;border-radius:50px;border:none;background:var(--accent);color:white;font-size:20px;font-weight:800;cursor:pointer;box-shadow:0 6px 20px rgba(255,107,53,.35);transition:transform .12s;margin-top:8px}
.start-btn:active{transform:scale(.97)}
.start-btn:disabled{background:#D3D1C7;box-shadow:none}

.puz-header{width:100%;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);flex-shrink:0}
.x-btn{background:none;border:none;color:rgba(255,255,255,.6);font-size:22px;cursor:pointer;padding:4px 8px}
.puz-info{color:rgba(255,255,255,.6);font-size:13px;font-weight:600}
.puz-timer{color:var(--accent3);font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.prog-wrap{width:100%;padding:0 16px 10px;flex-shrink:0}
.prog-bg{height:5px;background:rgba(255,255,255,.1);border-radius:3px}
.prog-fill{height:100%;background:var(--accent3);border-radius:3px;transition:width .3s;width:0%}
.board-wrap{flex:1;width:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;min-height:0}
#puzzle-board{position:relative;flex-shrink:0;background:rgba(255,255,255,.03);border-radius:8px;border:1px solid rgba(255,255,255,.08)}

/* pieces are absolutely-positioned <img> tags */
.piece{position:absolute;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.piece img{display:block;pointer-events:none;-webkit-user-drag:none}
.piece.dragging{cursor:grabbing;z-index:999!important}
.piece.snapped{cursor:default;z-index:2!important}

.tray{width:100%;padding:10px 12px;background:rgba(255,255,255,.06);display:flex;gap:8px;overflow-x:auto;flex-wrap:wrap;justify-content:center;min-height:90px;max-height:150px;flex-shrink:0;-webkit-overflow-scrolling:touch}

.win-emoji{font-size:80px;margin-bottom:16px;animation:bop .5s ease infinite alternate}
@keyframes bop{from{transform:scale(1)}to{transform:scale(1.12)}}
.win-title{font-size:38px;font-weight:900;margin-bottom:8px}
.win-sub{font-size:18px;opacity:.7;margin-bottom:32px}
.win-btn{padding:16px 36px;border-radius:50px;border:none;background:white;font-size:18px;font-weight:800;cursor:pointer;margin:8px;color:#1a0533;display:inline-block}
.win-btn.save{background:var(--accent3);color:var(--text)}

.cf{position:fixed;pointer-events:none;z-index:9999;width:10px;height:10px;border-radius:2px;animation:cffall linear forwards}
@keyframes cffall{0%{transform:translateY(-10px) rotate(0);opacity:1}100%{transform:translateY(105vh) rotate(540deg);opacity:0}}

.install-banner{position:fixed;bottom:0;left:0;right:0;background:var(--accent);color:white;padding:14px 20px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;z-index:10000;gap:12px}
.install-banner .cb{background:none;color:rgba(255,255,255,.8);border:none;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<div class="screen active" id="home-screen">
  <div class="logo">🧩</div>
  <div class="app-name">PuzzleKids</div>
  <div class="app-sub">Пазлы из твоих фотографий</div>
  <button class="big-btn btn-a" onclick="showScreen('setup-screen')">
    <span class="icon">📷</span>
    <span style="display:flex;flex-direction:column"><span class="t1">Загрузить фото</span><span class="t2">Сделай пазл из своей картинки</span></span>
  </button>
  <button class="big-btn btn-b" onclick="alert('Генерация — в следующей версии! ✨')">
    <span class="icon">✨</span>
    <span style="display:flex;flex-direction:column"><span class="t1">Сгенерировать</span><span class="t2">ИИ нарисует любую картинку</span></span>
  </button>
  <button class="big-btn btn-c" onclick="alert('Библиотека — скоро! 📚')">
    <span class="icon">📚</span>
    <span style="display:flex;flex-direction:column"><span class="t1">Библиотека</span><span class="t2">Мои сохранённые пазлы</span></span>
  </button>
</div>

<div class="screen" id="setup-screen">
  <button class="back-btn" onclick="showScreen('home-screen')">← Назад</button>
  <div class="screen-title">Настройки пазла</div>
  <div class="sg"><div class="sl">Сложность</div>
    <div class="option-row">
      <button class="opt" onclick="pick(this,'diff',3)">🐣 Малыш<br><small>9 деталей</small></button>
      <button class="opt sel" onclick="pick(this,'diff',4)">🌟 Средний<br><small>16 деталей</small></button>
      <button class="opt" onclick="pick(this,'diff',5)">🔥 Сложный<br><small>25 деталей</small></button>
    </div>
  </div>
  <div class="sg"><div class="sl">Форма деталей</div>
    <div class="option-row">
      <button class="opt sel" onclick="pick(this,'shape','square')">⬜ Квадраты</button>
      <button class="opt" onclick="pick(this,'shape','jigsaw')">🧩 Пазл</button>
    </div>
  </div>
  <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)" style="display:none">
  <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
    <div class="uph">
      <div style="font-size:48px;margin-bottom:8px">📷</div>
      <div style="font-size:15px;color:var(--muted);font-weight:600">Нажми, чтобы выбрать фото</div>
    </div>
  </div>
  <button class="start-btn" id="start-btn" disabled onclick="startPuzzle()">Начать пазл! 🧩</button>
</div>

<div class="screen" id="puzzle-screen">
  <div class="puz-header">
    <button class="x-btn" onclick="showScreen('home-screen')">✕</button>
    <div class="puz-info" id="puz-info"></div>
    <div class="puz-timer" id="puz-timer">0:00</div>
  </div>
  <div class="prog-wrap"><div class="prog-bg"><div class="prog-fill" id="prog-fill"></div></div></div>
  <div class="board-wrap" id="board-wrap">
    <div id="puzzle-board"></div>
  </div>
  <div class="tray" id="tray"></div>
</div>

<div class="screen" id="win-screen">
  <div class="win-emoji">🎉</div>
  <div class="win-title">Молодец!</div>
  <div class="win-sub" id="win-sub"></div>
  <button class="win-btn save" onclick="savePuzzle()">💾 Сохранить картинку</button>
  <button class="win-btn" onclick="startPuzzle()">Ещё раз</button>
  <button class="win-btn" onclick="showScreen('home-screen')">На главную</button>
</div>

<script>
let cfg={diff:4,shape:'square'};
let imgSrc=null,imgNatW=0,imgNatH=0;
let pieces=[];
let placed=0,total=0;
let timerID=null,t0=null,lastSec=0;
let drag=null;
let pW=0,pH=0,bW=0,bH=0;
let slices={}; // key "r-c" -> dataURL (with transparent bg for jigsaw)

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id!=='puzzle-screen') stopTimer();
}
function pick(btn,group,val){
  btn.closest('.option-row').querySelectorAll('.opt').forEach(b=>b.classList.remove('sel'));
  btn.classList.add('sel');
  cfg[group]=val;
}
function handleFile(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    const tmp=new Image();
    tmp.onload=()=>{
      imgNatW=tmp.naturalWidth; imgNatH=tmp.naturalHeight;
      imgSrc=ev.target.result;
      const area=document.getElementById('upload-area');
      area.innerHTML='';
      const img=document.createElement('img');
      img.src=imgSrc; area.appendChild(img);
      document.getElementById('start-btn').disabled=false;
    };
    tmp.src=ev.target.result;
  };
  reader.readAsDataURL(file);
}

// ── Jigsaw tab: deterministic per shared edge ──
// Returns +1 or -1 for the given edge of cell (r,c)
// Opposite neighbour always gets the inverse
function tab(r,c,side){
  // Canonical seed: always from the "smaller" cell's perspective
  let seed;
  if(side===0) seed=r*997+c*31+7;    // top  — shared with row r-1 bottom
  if(side===1) seed=r*997+(c+1)*31;  // right — shared with col c+1 left
  if(side===2) seed=(r+1)*997+c*31+7;// bottom — same as row r+1 top
  if(side===3) seed=r*997+c*31;      // left  — same as col c right
  const v=Math.sin(seed*127.1)*43758.5453;
  return (v-Math.floor(v))>0.5?1:-1;
}

// ── Draw jigsaw path on canvas context ──
// The canvas is (pW + 2*PAD) × (pH + 2*PAD), image drawn at (PAD, PAD)
// Tabs extend outside the pW×pH cell but are visible within the PAD margin
function drawJigsawPath(ctx, r, c, grid, pw, ph, pad){
  const tw=pw*0.18, th=ph*0.22; // tab half-width, tab height

  const T = r===0       ? 0 : tab(r,c,0);
  const R = c===grid-1  ? 0 : tab(r,c,1);
  const B = r===grid-1  ? 0 : tab(r,c,2);
  const L = c===0       ? 0 : tab(r,c,3);

  // All coords offset by PAD so tabs fit
  const ox=pad, oy=pad;

  ctx.beginPath();
  ctx.moveTo(ox, oy);

  // TOP (left→right)
  ctx.lineTo(ox + pw/2 - tw, oy);
  if(T!==0){
    ctx.bezierCurveTo(
      ox+pw/2-tw, oy-T*th*0.5,
      ox+pw/2-tw*0.3, oy-T*th,
      ox+pw/2, oy-T*th
    );
    ctx.bezierCurveTo(
      ox+pw/2+tw*0.3, oy-T*th,
      ox+pw/2+tw, oy-T*th*0.5,
      ox+pw/2+tw, oy
    );
  } else { ctx.lineTo(ox+pw/2+tw, oy); }
  ctx.lineTo(ox+pw, oy);

  // RIGHT (top→bottom)
  ctx.lineTo(ox+pw, oy+ph/2-tw);
  if(R!==0){
    ctx.bezierCurveTo(
      ox+pw+R*th*0.5, oy+ph/2-tw,
      ox+pw+R*th, oy+ph/2-tw*0.3,
      ox+pw+R*th, oy+ph/2
    );
    ctx.bezierCurveTo(
      ox+pw+R*th, oy+ph/2+tw*0.3,
      ox+pw+R*th*0.5, oy+ph/2+tw,
      ox+pw, oy+ph/2+tw
    );
  } else { ctx.lineTo(ox+pw, oy+ph/2+tw); }
  ctx.lineTo(ox+pw, oy+ph);

  // BOTTOM (right→left)
  ctx.lineTo(ox+pw/2+tw, oy+ph);
  if(B!==0){
    ctx.bezierCurveTo(
      ox+pw/2+tw, oy+ph+B*th*0.5,
      ox+pw/2+tw*0.3, oy+ph+B*th,
      ox+pw/2, oy+ph+B*th
    );
    ctx.bezierCurveTo(
      ox+pw/2-tw*0.3, oy+ph+B*th,
      ox+pw/2-tw, oy+ph+B*th*0.5,
      ox+pw/2-tw, oy+ph
    );
  } else { ctx.lineTo(ox+pw/2-tw, oy+ph); }
  ctx.lineTo(ox, oy+ph);

  // LEFT (bottom→top)
  ctx.lineTo(ox, oy+ph/2+tw);
  if(L!==0){
    ctx.bezierCurveTo(
      ox-L*th*0.5, oy+ph/2+tw,
      ox-L*th, oy+ph/2+tw*0.3,
      ox-L*th, oy+ph/2
    );
    ctx.bezierCurveTo(
      ox-L*th, oy+ph/2-tw*0.3,
      ox-L*th*0.5, oy+ph/2-tw,
      ox, oy+ph/2-tw
    );
  } else { ctx.lineTo(ox, oy+ph/2-tw); }
  ctx.lineTo(ox, oy);
  ctx.closePath();
}

// ── Slice all pieces into dataURLs ──
function buildSlices(masterImg, grid){
  slices={};
  const sw=masterImg.naturalWidth/grid;
  const sh=masterImg.naturalHeight/grid;
  const PAD=cfg.shape==='jigsaw' ? Math.round(Math.max(pW,pH)*0.28) : 0;

  for(let r=0;r<grid;r++){
    for(let c=0;c<grid;c++){
      const cw=pW+PAD*2, ch=pH+PAD*2;
      const oc=document.createElement('canvas');
      oc.width=cw; oc.height=ch;
      const ctx=oc.getContext('2d');
      ctx.imageSmoothingEnabled=true;
      ctx.imageSmoothingQuality='high';

      if(cfg.shape==='jigsaw'){
        // 1. Draw jigsaw clip path
        drawJigsawPath(ctx,r,c,grid,pW,pH,PAD);
        ctx.save();
        ctx.clip();
        // 2. Draw image ONLY inside clip — no black anywhere outside
        ctx.drawImage(masterImg, sw*c, sh*r, sw, sh, PAD, PAD, pW, pH);
        ctx.restore();
        // 3. Subtle border on piece edge
        ctx.save();
        drawJigsawPath(ctx,r,c,grid,pW,pH,PAD);
        ctx.strokeStyle='rgba(255,255,255,0.35)';
        ctx.lineWidth=1.5;
        ctx.stroke();
        ctx.restore();
      } else {
        // Square: no padding
        ctx.drawImage(masterImg, sw*c, sh*r, sw, sh, 0, 0, pW, pH);
        ctx.strokeStyle='rgba(255,255,255,0.2)';
        ctx.lineWidth=1;
        ctx.strokeRect(0.5,0.5,pW-1,pH-1);
      }

      slices[`${r}-${c}`]={
        dataURL: oc.toDataURL('image/png'),
        pad: PAD
      };
    }
  }
}

// ── Start / Build ──
function startPuzzle(){
  if(!imgSrc) return;
  showScreen('puzzle-screen');
  setTimeout(buildPuzzle,60);
}

function buildPuzzle(){
  const grid=cfg.diff;
  total=grid*grid; placed=0;

  const wrap=document.getElementById('board-wrap');
  const maxW=wrap.clientWidth-24;
  const maxH=wrap.clientHeight-24;
  const aspect=imgNatW/imgNatH;
  let bw,bh;
  if(maxW/maxH>aspect){bh=maxH;bw=Math.round(bh*aspect);}
  else{bw=maxW;bh=Math.round(bw/aspect);}
  pW=Math.floor(bw/grid); pH=Math.floor(bh/grid);
  bW=pW*grid; bH=pH*grid;

  const board=document.getElementById('puzzle-board');
  board.innerHTML='';
  board.style.width=bW+'px';
  board.style.height=bH+'px';
  board.style.overflow='visible'; // jigsaw tabs extend outside
  document.getElementById('tray').innerHTML='';
  pieces=[];
  document.getElementById('puz-info').textContent=`${grid}×${grid} • ${total} деталей`;
  document.getElementById('prog-fill').style.width='0%';

  // Ghost cells
  for(let r=0;r<grid;r++) for(let c=0;c<grid;c++){
    const g=document.createElement('div');
    g.style.cssText=`position:absolute;left:${c*pW}px;top:${r*pH}px;width:${pW}px;height:${pH}px;border:1px dashed rgba(255,255,255,0.12);pointer-events:none;z-index:0;`;
    board.appendChild(g);
  }

  const masterImg=new Image();
  masterImg.onload=()=>{
    buildSlices(masterImg,grid);
    const tray=document.getElementById('tray');
    const tSize=Math.min(pW,pH,80);
    const indices=shuffle([...Array(total).keys()]);

    indices.forEach(idx=>{
      const row=Math.floor(idx/grid), col=idx%grid;
      const {dataURL,pad}=slices[`${row}-${col}`];

      // Tray thumbnail
      const tEl=document.createElement('div');
      tEl.style.cssText=`width:${tSize}px;height:${tSize}px;flex-shrink:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.5)`;
      const tImg=document.createElement('img');
      tImg.src=dataURL;
      tImg.style.cssText=`display:block;width:${tSize+pad*2*(tSize/pW)}px;height:${tSize+pad*2*(tSize/pH)}px;margin-left:${-pad*(tSize/pW)}px;margin-top:${-pad*(tSize/pH)}px;pointer-events:none;-webkit-user-drag:none;`;
      tEl.appendChild(tImg);
      tray.appendChild(tEl);

      const piece={row,col,placed:false,trayEl:tEl,dataURL,pad};
      pieces.push(piece);
      attachDrag(tEl,piece);
    });

    startTimer();
  };
  masterImg.src=imgSrc;
}

// ── Create board piece (img positioned with negative margin for PAD) ──
function makeBoardPiece(piece){
  const {row,col,dataURL,pad}=piece;
  const el=document.createElement('div');
  el.className='piece snapped';
  // Position so the image content aligns with the grid cell
  el.style.cssText=`position:absolute;left:${col*pW-pad}px;top:${row*pH-pad}px;width:${pW+pad*2}px;height:${pH+pad*2}px;z-index:2;overflow:visible;`;
  const img=document.createElement('img');
  img.src=dataURL;
  img.style.cssText=`display:block;width:${pW+pad*2}px;height:${pH+pad*2}px;pointer-events:none;-webkit-user-drag:none;`;
  el.appendChild(img);
  return el;
}

// ── Drag ──
function attachDrag(el,piece){
  const start=(cx,cy)=>{
    if(piece.placed) return;
    const rect=el.getBoundingClientRect();
    const {dataURL,pad}=piece;
    const ghost=document.createElement('div');
    const gW=pW+pad*2, gH=pH+pad*2;
    ghost.style.cssText=`position:fixed;pointer-events:none;z-index:9999;left:${rect.left-pad}px;top:${rect.top-pad}px;width:${gW}px;height:${gH}px;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.7));`;
    const gImg=document.createElement('img');
    gImg.src=dataURL;
    gImg.style.cssText=`display:block;width:${gW}px;height:${gH}px;pointer-events:none;-webkit-user-drag:none;`;
    ghost.appendChild(gImg);
    document.body.appendChild(ghost);
    drag={
      piece,ghost,trayEl:el,
      offX:cx-rect.left+pad,
      offY:cy-rect.top+pad
    };
    el.style.opacity='0.25';
  };
  el.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY);});
  el.addEventListener('touchstart',e=>{e.preventDefault();const t=e.touches[0];start(t.clientX,t.clientY);},{passive:false});
}

document.addEventListener('mousemove',onMove);
document.addEventListener('touchmove',e=>{if(drag){e.preventDefault();onMove(e);}},{passive:false});
document.addEventListener('mouseup',onEnd);
document.addEventListener('touchend',onEnd);

function onMove(e){
  if(!drag) return;
  const {clientX,clientY}=e.touches?e.touches[0]:e;
  drag.ghost.style.left=(clientX-drag.offX)+'px';
  drag.ghost.style.top=(clientY-drag.offY)+'px';
}

function onEnd(e){
  if(!drag) return;
  const {clientX,clientY}=e.changedTouches?e.changedTouches[0]:e;
  const board=document.getElementById('puzzle-board');
  const br=board.getBoundingClientRect();
  const relX=clientX-br.left, relY=clientY-br.top;
  const dropCol=Math.floor(relX/pW), dropRow=Math.floor(relY/pH);
  const {piece}=drag;
  const inBoard=relX>=0&&relY>=0&&relX<bW&&relY<bH;
  const correct=inBoard&&dropRow===piece.row&&dropCol===piece.col;

  if(!piece.placed&&correct){
    const el=makeBoardPiece(piece);
    board.appendChild(el);
    piece.placed=true;
    drag.trayEl.remove();
    placed++;
    document.getElementById('prog-fill').style.width=(placed/total*100)+'%';
    el.style.transform='scale(1.04)';
    setTimeout(()=>{el.style.transform='';},130);
    if(placed===total) setTimeout(winGame,400);
  } else {
    drag.trayEl.style.opacity='1';
    if(inBoard&&!correct)
      drag.trayEl.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:''}],{duration:200});
  }
  drag.ghost.remove(); drag=null;
}

function startTimer(){
  stopTimer(); t0=Date.now();
  timerID=setInterval(()=>{
    lastSec=Math.floor((Date.now()-t0)/1000);
    document.getElementById('puz-timer').textContent=
      `${Math.floor(lastSec/60)}:${String(lastSec%60).padStart(2,'0')}`;
  },500);
}
function stopTimer(){if(timerID) clearInterval(timerID);timerID=null;}

function winGame(){
  stopTimer();
  document.getElementById('win-sub').textContent=
    `Время: ${Math.floor(lastSec/60)}:${String(lastSec%60).padStart(2,'0')} ⏱`;
  showScreen('win-screen');
  confetti();
}

function savePuzzle(){
  const c=document.createElement('canvas');
  c.width=bW;c.height=bH;
  const ctx=c.getContext('2d');
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  const img=new Image();
  img.onload=()=>{
    ctx.drawImage(img,0,0,bW,bH);
    const a=document.createElement('a');
    a.download='puzzle.png';
    a.href=c.toDataURL('image/png');
    a.click();
  };
  img.src=imgSrc;
}

function confetti(){
  const cl=['#FF6B35','#4ECDC4','#FFE66D','#FF6B9D','#A8E6CF'];
  for(let i=0;i<70;i++) setTimeout(()=>{
    const el=document.createElement('div');
    el.className='cf';
    el.style.cssText=`left:${Math.random()*100}vw;top:-12px;background:${cl[Math.random()*cl.length|0]};animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*0.3}s;`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(),4000);
  },i*35);
}

function shuffle(a){
  for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
if(isIOS&&!window.navigator.standalone&&!sessionStorage.getItem('b')){
  const b=document.createElement('div');
  b.className='install-banner';
  b.innerHTML=`<span>📲 Добавь на экран — ребёнок не выйдет случайно!</span><button class="cb" onclick="this.parentElement.remove();sessionStorage.setItem('b','1')">×</button>`;
  document.body.appendChild(b);
}
</script>
